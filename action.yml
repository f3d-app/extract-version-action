name: 'Extract specific version from a versions.json file'
description: 'Extract a specific version from a versions.json file used in F3D CI'
inputs:
  file:
    description: 'Local file to recover version information from'
    required: true
  name:
    description: 'Name of the version to extract'
    required: false
  prefix:
    description: 'A version prefix'
    required: false
  special_name:
    description: 'A special name to extract, ignoring other arguments'
    required: false

outputs:
  extracted:
    value: "${{steps.extract_json.outputs.extracted}}"

runs:
  using: "composite"
  steps:

    - name: Check required inputs
      shell: bash
      run: |
        [[ "${{ inputs.file }}" ]] || { echo "file input is empty" ; exit 1; }

    # Only one of the two lines is run
    - name: Extract specific json info
      id: extract_json
      shell: bash
      run: |
        [ -z ${{inputs.special_name}} ] && echo "extracted=$(jq -r '${{inputs.prefix}}versions.${{inputs.name}}' < ${{ inputs.file }})" >> $GITHUB_OUTPUT
        [ -n ${{inputs.special_name}} ] && echo "extracted=$(jq -r '${{inputs.special_name}}' < ${{ inputs.file }})" >> $GITHUB_OUTPUT
